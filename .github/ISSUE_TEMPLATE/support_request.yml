name: Support request
description: Ask for help with installation, usage, or troubleshooting.
title: "[Support]: "
body:
  - type: markdown
    attributes:
      value: >-
        Please read the user manual first. Remove wishlist IDs, product history,
        addresses, cookies, account details, and other private data before posting.
  - type: dropdown
    id: area
    attributes:
      label: Help area
      options:
        - Installation or update
        - Product tracking
        - Wishlist import or sync
        - Alerts or notifications
        - Backup or restore
        - Other
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What are you trying to do, and where are you blocked?
    validations:
      required: true
  - type: textarea
    id: attempted
    attributes:
      label: What have you tried?
      description: Include the relevant user-manual steps and the result you observed.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version or commit
      placeholder: 1.4.1 or a commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Chrome and operating-system version
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Optional console errors or screenshots with private data removed.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, cookies, private wishlist IDs, and personal data.
          required: true
