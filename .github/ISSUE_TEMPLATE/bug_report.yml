name: Bug report
description: Report a reproducible problem without including private shopping data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Thanks for reporting a problem. Remove wishlist IDs, product history, addresses,
        cookies, account details, and other private data before posting.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version or commit
      placeholder: 1.2.0 or a commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Chrome and operating-system version
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Optional console errors or screenshots with private data removed.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, cookies, private wishlist IDs, and personal data.
          required: true
