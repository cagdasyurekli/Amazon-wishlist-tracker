<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Amazon Wishlist Tracker social preview</title>
  <desc id="description">Privacy-first, local Amazon product and wishlist price tracking.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101A2C"/>
      <stop offset="1" stop-color="#1B2D49"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#13C6A3" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#13C6A3" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" rx="28" fill="url(#background)"/>
  <circle cx="1080" cy="110" r="280" fill="url(#glow)"/>
  <circle cx="160" cy="650" r="330" fill="url(#glow)" opacity="0.55"/>

  <g transform="translate(96 176) scale(2.25)">
    <rect x="8" y="8" width="112" height="112" rx="28" fill="#152238" stroke="#2C4263" stroke-width="2"/>
    <path d="M40 28 H88 C90.2 28 92 29.8 92 32 V96 L64 78 L36 96 V32 C36 29.8 37.8 28 40 28 Z" fill="none" stroke="#F7FAFC" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M47 48 L58 59 L68 53 L82 68" fill="none" stroke="#13C6A3" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="82" cy="68" r="5" fill="#13C6A3"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="444" y="235" fill="#8DE6D3" font-size="28" font-weight="700" letter-spacing="2">PRIVACY-FIRST · MANIFEST V3</text>
    <text x="444" y="318" fill="#F7FAFC" font-size="64" font-weight="750">Amazon Wishlist</text>
    <text x="444" y="390" fill="#F7FAFC" font-size="64" font-weight="750">Tracker</text>
    <text x="444" y="453" fill="#C8D5E6" font-size="30">Local price history, targets, alerts, and wishlist sync.</text>
    <g transform="translate(444 500)" font-size="23" font-weight="650">
      <rect width="174" height="48" rx="24" fill="#213A51"/>
      <text x="87" y="31" text-anchor="middle" fill="#E8F2FA">No backend</text>
      <rect x="190" width="208" height="48" rx="24" fill="#213A51"/>
      <text x="294" y="31" text-anchor="middle" fill="#E8F2FA">7 Amazon regions</text>
      <rect x="414" width="208" height="48" rx="24" fill="#213A51"/>
      <text x="518" y="31" text-anchor="middle" fill="#E8F2FA">Open source</text>
    </g>
  </g>
</svg>
